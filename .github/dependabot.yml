version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Updates go to the development branch; main only moves at releases.
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # Godot's SDK version must match the editor and export templates; update them together.
      - dependency-name: Godot.NET.Sdk
