name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install documentation checker
        run: |
          python3 -m venv "$RUNNER_TEMP/openwinter-docs"
          "$RUNNER_TEMP/openwinter-docs/bin/python" -m pip install --require-hashes --only-binary=:all: -r tools/docs/requirements.txt

      - name: Test documentation checker
        run: |
          "$RUNNER_TEMP/openwinter-docs/bin/python" -m unittest discover -s tools/docs -p 'test_*.py'

      - name: Check relative documentation links
        run: |
          "$RUNNER_TEMP/openwinter-docs/bin/python" tools/docs/check_links.py

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Whitespace and layout per .editorconfig. Fix locally with: dotnet format whitespace OpenWinter.slnx
      - name: Check formatting
        run: dotnet format whitespace OpenWinter.slnx --verify-no-changes

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Includes the Godot client, which builds with the Godot .NET SDK package alone.
      - name: Build
        run: dotnet build OpenWinter.slnx -c Release

      # Tests that need the game's data are skipped: CI has no copy of the game.
      - name: Test
        run: dotnet test OpenWinter.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          retention-days: 7
